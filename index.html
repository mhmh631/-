function dash(){let its=S.d.items,bs=its.flatMap(i=>S.d.wh.map(w=>({i,w,q:bal(i.id,w.id)}))),low=bs.filter(x=>x.q>0&&x.q<=x.i.re).length,out=S.d.tx.filter(t=>t.t=="OUT").reduce((s,t)=>s+t.q,0),inn=S.d.tx.filter(t=>["IN","TIN"].includes(t.t)).reduce((s,t)=>s+t.q,0),val=its.reduce((s,i)=>s+total(i.id)*i.buy,0),ms=Array.from({length:12},(_,m)=>({in:S.d.tx.filter(t=>new Date(t.d).getMonth()==m&&["IN","TIN"].includes(t.t)).reduce((s,t)=>s+t.q,0),out:S.d.tx.filter(t=>new Date(t.d).getMonth()==m&&["OUT","TOUT"].includes(t.t)).reduce((s,t)=>s+t.q,0)})),mx=Math.max(1,...ms.flatMap(x=>[x.in,x.out]));return `<div class="head"><div><h3>لوحة التحكم</h3><span class="mut">تشغيل فعلي داخل المتصفح</span></div><div><button class="btn s" onclick="receipt('IN')">+ إدخال</button> <button class="btn p" onclick="receipt('OUT')">+ إخراج</button></div></div><div class="cards">${k("إجمالي المواد",f(its.length),"مادة")}${k("المستودعات",f(S.d.wh.length),"مستودعات")}${k("إجمالي الرصيد",f(bs.reduce((s,x)=>s+x.q,0)),"كل المستودعات")}${k("منخفض/إعادة طلب",f(low),"يحتاج متابعة")}${k("الوارد",f(inn),"حركات الإدخال")}${k("الصادر",f(out),"حركات الإخراج")}${k("التحويلات",f(S.d.rec.filter(x=>x.type=="TR").length),"سندات")}${k("قيمة المخزون",money(val),"تقريبية بسعر الشراء")}</div><div class="grid"><div class="card"><h3>حركة المخزون</h3><div class="legend">🟢 وارد &nbsp; 🔴 صادر</div><div class="bars">${ms.map(x=>`<div class="barc"><i class="bar" style="height:${x.in/mx*100}%" ></i><i class="bar outbar" style="height:${x.out/mx*100}%"></i></div>`).join("")}</div></div><div class="card"><h3>مواد تحتاج إعادة طلب</h3>${bs.filter(x=>x.q<=x.i.re).slice(0,7).map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(x.i.n)}<small class="mut"><br>${esc(x.w.n)}</small></span><b class="badge ${x.q<=0?"out":"low"}">${f(x.q)}</b></div>`).join("")||"<div class=mut>لا توجد مواد منخفضة</div>"}</div></div><div class="grid"><div class="card"><h3>آخر العمليات</h3><div class="table"><table><tr><th>التاريخ</th><th>الحركة</th><th>المادة</th><th>الكمية</th><th>السند</th></tr>${S.d.tx.slice().reverse().slice(0,8).map(t=>`<tr><td>${t.d}</td><td>${t.t}</td><td>${esc(I(t.i)?.n)}</td><td>${f(t.q)}</td><td>${t.ref}</td></tr>`).join("")}</table></div></div><div class="card"><h3>أكثر المواد حركة</h3>${its.map(i=>({i,n:S.d.tx.filter(t=>t.i==i.id).reduce((s,t)=>s+t.q,0)})).sort((a,b)=>b.n-a.n).slice(0,5).map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">${esc(x.i.n)} <b style="float:left">${f(x.n)}</b></div>`).join("")}</div></div>`}
function items(){return `<div class="head"><div><h3>المواد</h3><span class="mut">${f(S.d.items.length)} مادة</span></div><button class="btn p" onclick="itemForm()">+ مادة</button></div><div class="card"><label>بحث<input id="iq" oninput="itemFilter()" placeholder="الاسم، الكود، الباركود"></label><br><div class="table"><table><thead><tr><th>الكود</th><th>المادة</th><th>الباركود</th><th>الوحدة</th><th>الرصيد</th><th>إعادة الطلب</th><th>الحالة</th><th></th></tr></thead><tbody id="ib">${itemRows(S.d.items)}</tbody></table></div></div>`}
function itemRows(a){return a.map(i=>{let q=total(i.id),st=q<=0?["نافد","out"]:q<=i.re?["منخفض","low"]:["متوفر","ok"];return `<tr><td>${i.c}</td><td><b>${esc(i.n)}</b><small class="mut"><br>${esc(C(i.cat)?.n||"")}</small></td><td>${i.bar}</td><td>${U(i.unit)?.n}</td><td>${f(q)}</td><td>${f(i.re)}</td><td><span class="badge ${st[1]}">${st[0]}</span></td><td><button class="btn s" onclick="itemForm('${i.id}')">فتح</button></td></tr>`}).join("")}
function itemFilter(){let q=document.getElementById("iq").value.toLowerCase();document.getElementById("ib").innerHTML=itemRows(S.d.items.filter(i=>[i.n,i.c,i.bar].some(x=>String(x).toLowerCase().includes(q))))}
function itemForm(x){if(!act("items.add"))return deny();let i=I(x)||{c:"",n:"",bar:"",cat:"c1",unit:"u1",re:0,buy:0,sale:0};open(x?"تعديل مادة":"إضافة مادة",`<form id="if" class="form"><label>الكود<input name=c required value="${esc(i.c)}"></label><label>الاسم<input name=n required value="${esc(i.n)}"></label><label>الباركود<input name=bar value="${esc(i.bar)}"></label><label>التصنيف<select name=cat>${S.d.cat.map(c=>`<option value="${c.id}" ${c.id==i.cat?"selected":""}>${esc(c.n)}</option>`).join("")}</select></label><label>الوحدة<select name=unit>${S.d.unit.map(u=>`<option value="${u.id}" ${u.id==i.unit?"selected":""}>${esc(u.n)}</option>`).join("")}</select></label><label>حد إعادة الطلب<input name=re type=number value="${i.re}"></label><label>سعر الشراء<input name=buy type=number step=.01 value="${i.buy}"></label><label>سعر البيع<input name=sale type=number step=.01 value="${i.sale}"></label><label class=full>ملاحظات<textarea name=notes>${esc(i.notes||"")}</textarea></label><div class=full><button class="btn p">حفظ</button> <button type=button class="btn o" onclick="closeM()">إلغاء</button></div></form>`);document.getElementById("if").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={...i,id:i.id||id("i"),c:f.get("c").trim(),n:f.get("n").trim(),bar:f.get("bar").trim(),cat:f.get("cat"),unit:f.get("unit"),re:+f.get("re"),buy:+f.get("buy"),sale:+f.get("sale"),active:1,notes:f.get("notes")};if(S.d.items.some(z=>z.id!=o.id&&(z.c==o.c||o.bar&&z.bar==o.bar))){toast("الكود أو الباركود مستخدم");return}if(i.id)Object.assign(i,o);else S.d.items.push(o);audit(i.id?"تعديل مادة":"إضافة مادة","Items",o.id);save();closeM();render();toast("تم حفظ المادة")}}
function whs(){return `<div class="head"><div><h3>المستودعات</h3><span class=mut>${S.d.wh.length} مستودعات</span></div><button class="btn p" onclick="whForm()">+ مستودع</button></div><div class=grid3>${S.d.wh.map(w=>{let q=S.d.items.reduce((s,i)=>s+bal(i.id,w.id),0),lo=S.d.items.filter(i=>bal(i.id,w.id)<=i.re).length;return `<div class=card><div class=head><h3>${esc(w.n)}</h3><button class="btn s" onclick="whDetails('${w.id}')">فتح</button></div><p class=mut>${w.c} · ${esc(w.l)}</p><hr><b>الرصيد: ${f(q)}</b><br><span class="badge ${lo?"low":"ok"}">منخفض: ${lo}</span></div>`}).join("")}</div>`}
function whForm(x){if(!act("wh.add"))return deny();let w=W(x)||{c:"",n:"",l:"",main:0};open(x?"تعديل مستودع":"إضافة مستودع",`<form id=wf class=form><label>الرمز<input name=c value="${esc(w.c)}" required></label><label>الاسم<input name=n value="${esc(w.n)}" required></label><label>الموقع<input name=l value="${esc(w.l)}"></label><label>رئيسي<select name=main><option value=0>لا</option><option value=1 ${w.main?"selected":""}>نعم</option></select></label><div class=full><button class="btn p">حفظ</button></div></form>`);document.getElementById("wf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={...w,id:w.id||id("w"),c:f.get("c"),n:f.get("n"),l:f.get("l"),main:+f.get("main")};if(o.main)S.d.wh.forEach(z=>{if(z.id!=o.id)z.main=0});if(w.id)Object.assign(w,o);else S.d.wh.push(o);audit("حفظ مستودع","Warehouses",o.id);save();closeM();render();toast("تم حفظ المستودع")}}
function whDetails(x){let w=W(x),a=S.d.items.map(i=>({i,q:bal(i.id,x)}));open("أرصدة "+w.n,`<div class=table><table><tr><th>الكود</th><th>المادة</th><th>الوحدة</th><th>الرصيد</th><th>الحالة</th></tr>${a.map(z=>`<tr><td>${z.i.c}</td><td>${esc(z.i.n)}</td><td>${U(z.i.unit)?.n}</td><td>${f(z.q)}</td><td><span class="badge ${z.q<=0?"out":z.q<=z.i.re?"low":"ok"}">${z.q<=0?"نافد":z.q<=z.i.re?"منخفض":"متوفر"}</span></td></tr>`).join("")}</table></div>`)}
function stock(){let rs=S.d.rec.slice().reverse();return `<div class=head><div><h3>حركات المخزون</h3><span class=mut>الإدخال والإخراج والتحويل</span></div><div><button class="btn s" onclick="receipt('IN')">+ إدخال</button> <button class="btn p" onclick="receipt('OUT')">+ إخراج</button> <button class="btn b" onclick="transfer()">⇄ تحويل</button></div></div><div class=card><div class=table><table><tr><th>السند</th><th>النوع</th><th>التاريخ</th><th>المستودع</th><th>الحالة</th></tr>${rs.map(r=>`<tr><td>${r.no}</td><td>${r.type=="IN"?"إدخال":r.type=="OUT"?"إخراج":"تحويل"}</td><td>${r.d}</td><td>${esc(W(r.w)?.n)}</td><td><span class="badge ok">معتمد</span></td></tr>`).join("")||"<tr><td colspan=5>لا توجد سندات</td></tr>"}</table></div></div>`}
function receipt(type){if(!act("stock.in"))return deny();let pre=type=="IN"?"GRN":"ISS",no=pre+"-"+String(S.d.rec.filter(r=>r.no.startsWith(pre)).length+1).padStart(4,"0");open(type=="IN"?"سند إدخال":"سند إخراج",`<form id=rf><div class=form><label>رقم السند<input name=no value="${no}" readonly></label><label>التاريخ<input name=d type=date value="${date()}"></label><label>المستودع<select name=w>${S.d.wh.map(w=>`<option value=${w.id}>${esc(w.n)}</option>`).join("")}</select></label><label>الجهة<input name=partner></label><label class=full>ملاحظات<input name=notes></label></div><hr><button type=button class="btn s" onclick="line()">+ مادة</button><div id=lines></div><br><button class="btn p">اعتماد السند</button></form>`);line();document.getElementById("rf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ls=[...document.querySelectorAll(".ln")].map(x=>({i:x.querySelector(".li").value,q:+x.querySelector(".lq").value,p:+x.querySelector(".lp").value})).filter(x=>x.q>0),w=f.get("w");if(!ls.length)return toast("أضف مادة");if(type=="OUT"&&!S.d.set.negative)for(let l of ls)if(l.q>bal(l.i,w))return toast("الرصيد غير كافٍ للمادة: "+I(l.i).n);let r={id:id("r"),no:f.get("no"),type,d:f.get("d"),w,partner:f.get("partner"),notes:f.get("notes"),lines:ls};S.d.rec.push(r);ls.forEach(l=>S.d.tx.push({id:id("t"),t:type,w,i:l.i,q:l.q,ref:r.no,d:r.d,u:S.u.u}));audit("اعتماد "+type,r.type,r.id);save();closeM();render();toast("تم اعتماد السند وتحديث الرصيد")}}
function line(){let d=document.createElement("div");d.className="line ln";d.innerHTML=`<select class=li>${S.d.items.map(i=>`<option value=${i.id}>${esc(i.c)} — ${esc(i.n)}</option>`).join("")}</select><input class=lq type=number min=.01 step=.01 value=1><input class=lp type=number min=0 step=.01 value=0><button type=button class="btn o" onclick="this.parentNode.remove()">×</button>`;document.getElementById("lines").appendChild(d)}
function transfer(){if(!act("stock.transfer"))return deny();open("سند تحويل",`<form id=tf><div class=form><label>من<select name=f>${S.d.wh.map(w=>`<option value=${w.id}>${esc(w.n)}</option>`).join("")}</select></label><label>إلى<select name=t>${S.d.wh.map(w=>`<option value=${w.id}>${esc(w.n)}</option>`).join("")}</select></label><label>التاريخ<input name=d type=date value="${date()}"></label><label>رقم السند<input name=no value="TR-"+String(S.d.rec.filter(r=>r.type=="TR").length+1).padStart(4,"0")></label></div><br><button type=button class="btn s" onclick="trline()">+ مادة</button><div id=tl></div><br><button class="btn b">اعتماد التحويل</button></form>`);trline();document.getElementById("tf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),from=f.get("f"),to=f.get("t"),ls=[...document.querySelectorAll(".tr")].map(x=>({i:x.querySelector(".ti").value,q:+x.querySelector(".tq").value})).filter(x=>x.q>0);if(from==to)return toast("اختر مستودعين مختلفين");for(let l of ls)if(!S.d.set.negative&&l.q>bal(l.i,from))return toast("الرصيد غير كافٍ للتحويل");let r={id:id("r"),no:f.get("no"),type:"TR",d:f.get("d"),w:from,to,lines:ls};S.d.rec.push(r);ls.forEach(l=>{S.d.tx.push({id:id("t"),t:"TOUT",w:from,i:l.i,q:l.q,ref:r.no,d:r.d,u:S.u.u});S.d.tx.push({id:id("t"),t:"TIN",w:to,i:l.i,q:l.q,ref:r.no,d:r.d,u:S.u.u})});audit("اعتماد تحويل","TransferReceipts",r.id);save();closeM();render();toast("تم التحويل")}}
function trline(){let d=document.createElement("div");d.className="line tr";d.innerHTML=`<select class=ti>${S.d.items.map(i=>`<option value=${i.id}>${esc(i.n)}</option>`).join("")}</select><input class=tq type=number min=.01 step=.01 value=1><span></span><button type=button class="btn o" onclick="this.parentNode.remove()">×</button>`;document.getElementById("tl").appendChild(d)}
function counts(){return `<div class=head><div><h3>الجرد والتسويات</h3><span class=mut>مطابقة الدفتري مع الفعلي</span></div><button class="btn p" onclick="countForm()">+ جرد جديد</button></div><div class=card><div class=table><table><tr><th>الرقم</th><th>المستودع</th><th>التاريخ</th><th>الفروقات</th></tr>${S.d.counts.slice().reverse().map(c=>`<tr><td>${c.no}</td><td>${W(c.w)?.n}</td><td>${c.d}</td><td>${f(c.lines.reduce((s,l)=>s+Math.abs(l.diff),0))}</td></tr>`).join("")||"<tr><td colspan=4>لا يوجد جرد</td></tr>"}</table></div></div>`}
function countForm(){if(!act("count.add"))return deny();open("جرد جديد",`<form id=cf><label>المستودع<select name=w id=cw onchange="countLines()">${S.d.wh.map(w=>`<option value=${w.id}>${esc(w.n)}</option>`).join("")}</select></label><br><div id=cl></div><br><button class="btn p">اعتماد الجرد</button></form>`);countLines();document.getElementById("cf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=f.get("w"),ls=[...document.querySelectorAll(".ca")].map(x=>{let i=I(x.dataset.i),book=bal(i.id,w),actual=+x.value;return{i:i.id,book,actual,diff:actual-book}}).filter(x=>x.diff);let c={id:id("c"),no:"CNT-"+String(S.d.counts.length+1).padStart(4,"0"),d:date(),w,lines:ls};ls.forEach(l=>S.d.tx.push({id:id("t"),t:l.diff>0?"AIN":"AOUT",w,i:l.i,q:Math.abs(l.diff),ref:c.no,d:c.d,u:S.u.u}));S.d.counts.push(c);audit("اعتماد جرد","InventoryCounts",c.id);save();closeM();render();toast("تم اعتماد الجرد والتسوية")}}
function countLines(){let w=document.getElementById("cw").value;document.getElementById("cl").innerHTML=`<div class=table><table><tr><th>المادة</th><th>الدفتري</th><th>الفعلي</th></tr>${S.d.items.map(i=>`<tr><td>${esc(i.n)}</td><td>${f(bal(i.id,w))}</td><td><input class=ca data-i=${i.id} type=number value="${bal(i.id,w)}"></td></tr>`).join("")}</table></div>`}
function partners(){return `<div class=grid><div class=card><div class=head><h3>الموردون</h3><button class="btn p" onclick="partner('sup')">+ مورد</button></div>${S.d.sup.map(x=>`<p>${x.c} — <b>${esc(x.n)}</b></p>`).join("")}</div><div class=card><div class=head><h3>العملاء</h3><button class="btn p" onclick="partner('cus')">+ عميل</button></div>${S.d.cus.map(x=>`<p>${x.c} — <b>${esc(x.n)}</b></p>`).join("")}</div></div>`}
function partner(t){if(!act("partners.edit"))return deny();let a=t=="sup"?S.d.sup:S.d.cus;open(t=="sup"?"إضافة مورد":"إضافة عميل",`<form id=pf class=form><label>الكود<input name=c value="${t=="sup"?"SUP":"CUS"}-${String(a.length+1).padStart(2,"0")}"></label><label>الاسم<input name=n required></label><label>الهاتف<input name=p></label><label>البريد<input name=e></label><div class=full><button class="btn p">حفظ</button></div></form>`);document.getElementById("pf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:id(t),c:f.get("c"),n:f.get("n"),p:f.get("p"),e:f.get("e")};a.push(o);audit("إضافة جهة",t,o.id);save();closeM();render();toast("تم الحفظ")}}
function reports(){let rows=S.d.items.flatMap(i=>S.d.wh.map(w=>({w:w.n,c:i.c,n:i.n,q:bal(i.id,w.id),re:i.re})));return `<div class=head><div><h3>التقارير</h3><span class=mut>أرصدة وحركة المخزون</span></div><div><button class="btn s" onclick="report('stock')">أرصدة</button> <button class="btn b" onclick="report('tx')">حركة</button></div></div><div class=grid3><div class=card><h3>قيمة المخزون</h3><b style="font-size:25px">${money(S.d.items.reduce((s,i)=>s+total(i.id)*i.buy,0))}</b></div><div class=card><h3>الحركات</h3><b style="font-size:25px">${f(S.d.tx.length)}</b></div><div class=card><h3>منخفض المخزون</h3><b style="font-size:25px">${f(rows.filter(x=>x.q<=x.re).length)}</b></div></div><div class=card style="margin-top:13px"><h3>أرصدة مختصرة</h3><div class=table><table><tr><th>المستودع</th><th>الكود</th><th>المادة</th><th>الرصيد</th><th>إعادة الطلب</th></tr>${rows.map(x=>`<tr><td>${esc(x.w)}</td><td>${x.c}</td><td>${esc(x.n)}</td><td>${f(x.q)}</td><td>${f(x.re)}</td></tr>`).join("")}</table></div></div>`}
function report(t){let rows=t=="stock"?S.d.items.flatMap(i=>S.d.wh.map(w=>({المستودع:w.n,الكود:i.c,المادة:i.n,الرصيد:bal(i.id,w.id),إعادة_الطلب:i.re}))):S.d.tx.map(x=>({التاريخ:x.d,النوع:x.t,المادة:I(x.i)?.n,المستودع:W(x.w)?.n,الكمية:x.q,السند:x.ref}));let h=Object.keys(rows[0]);let c="\ufeff"+h.join(",")+"\n"+rows.map(r=>h.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv;charset=utf-8"}));a.download=t+".csv";a.click();toast("تم تصدير CSV")}
function search(){return `<div class=card><h3>البحث الشامل</h3><label>بحث<input id=gs oninput="gsearch()" autofocus placeholder="اسم المادة، الكود، الباركود، رقم السند..."></label><div id=gr style="margin-top:15px" class=mut>ابدأ الكتابة</div></div>`}
function gsearch(){let q=document.getElementById("gs").value.toLowerCase(),a=S.d.items.filter(i=>[i.n,i.c,i.bar].some(x=>String(x).toLowerCase().includes(q))),r=S.d.rec.filter(x=>x.no.toLowerCase().includes(q));document.getElementById("gr").innerHTML=[...a.map(i=>`<div class=card style="margin:7px 0"><b>${esc(i.n)}</b><br>${i.c} · الرصيد ${f(total(i.id))}</div>`),...r.map(x=>`<div class=card style="margin:7px 0"><b>${x.no}</b><br>${x.type} · ${x.d}</div>`)].join("")||"لا توجد نتائج"}
function barcode(){return `<div class=grid><div class=card><h3>قارئ الباركود</h3><label>الباركود<input id=bi oninput="bl()" autofocus></label><div id=br style="margin-top:15px" class=mut>اكتب أو امسح الباركود</div></div><div class=card><h3>كاميرا الهاتف</h3><p class=mut>يتم تفعيل BarcodeDetector تلقائيًا في المتصفحات الداعمة له.</p><button class="btn p" onclick="scan()">تشغيل الكاميرا</button><video id=vid autoplay playsinline class=hide style="width:100%;margin-top:10px"></video></div></div>`}
function bl(){let q=document.getElementById("bi").value.trim(),i=S.d.items.find(x=>x.bar==q);document.getElementById("br").innerHTML=i?`<div class=card><b>${esc(i.n)}</b><br>${i.c}<br>الرصيد: <b>${f(total(i.id))}</b></div>`:q?`<div class=badge out>الباركود غير مسجل — يمكنك إنشاء مادة جديدة من شاشة المواد</div>`:"اكتب أو امسح الباركود"}
async function scan(){if(!("BarcodeDetector"in window))return toast("المتصفح لا يدعم قارئ الكاميرا المباشر");try{let v=document.getElementById("vid"),s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.classList.remove("hide");v.srcObject=s;let d=new BarcodeDetector(),go=async()=>{let z=await d.detect(v);if(z[0]){document.getElementById("bi").value=z[0].rawValue;bl();s.getTracks().forEach(t=>t.stop());v.classList.add("hide");return}requestAnimationFrame(go)};go()}catch(e){toast("تعذر تشغيل الكاميرا")}}

function setAvatar(id,u){let e=document.getElementById(id);if(!e)return;if(u&&u.avatar){e.outerHTML=`<img id="${id}" class="avatar profilemini" src="${u.avatar}" alt="صورة ${esc(u.n||"")}">`}else e.textContent=(u?.n||"م")[0]||"م"}
function avatarHtml(u,cls="profilepic"){return u?.avatar?`<img class="${cls}" src="${u.avatar}" alt="صورة شخصية">`:`<div class="${cls}">${esc((u?.n||"م")[0]||"م")}</div>`}
function readAvatar(file,cb){if(!file)return cb("");if(file.size>700*1024)return toast("حجم الصورة كبير؛ الحد الأقصى 700 كيلوبايت");let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function profile(){let u=S.u||{};return `<div class=head><div><h3>ملفي الشخصي</h3><span class=mut>تعديل بياناتك الشخصية وصورتك ورقم هاتفك</span></div></div><div class=grid><div class=card><div style="display:flex;gap:15px;align-items:center">${avatarHtml(u)}<div><h3 style="margin:0">${esc(u.n||"")}</h3><div class=mut>${esc(u.r||"")}</div><div class=mut>${esc(u.u||"")}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><form id=pfself class=form><label>الاسم الكامل<input name=n value="${esc(u.n||"")}" required></label><label>المسمى الوظيفي<input name=job value="${esc(u.job||"")}" placeholder="مثال: مسؤول مستودع"></label><label>رقم الهاتف<input name=phone value="${esc(u.phone||"")}" inputmode=tel placeholder="+1 ..."></label><label>البريد الإلكتروني<input name=email type=email value="${esc(u.email||"")}"></label><label>رقم الموظف<input name=emp value="${esc(u.emp||"")}"></label><label>العنوان<input name=address value="${esc(u.address||"")}"></label><label class=full>ملاحظات<textarea name=notes>${esc(u.notes||"")}</textarea></label><label class=full>الصورة الشخصية<input class=upload id=selfavatar type=file accept="image/*"><small class=mut>يفضل صورة مربعة، والحد الأقصى 700 كيلوبايت.</small></label><label>كلمة المرور الجديدة<input name=p type=password placeholder="اتركها فارغة للإبقاء عليها"></label><div class=full><button class="btn p">حفظ بياناتي</button></div></form></div><div class=card><h3>معلومات الحساب</h3><div class=mut style="line-height:2.2">اسم المستخدم: <b>${esc(u.u||"")}</b><br>الدور: <b>${esc(u.r||"")}</b><br>الحالة: <span class="badge ok">فعال</span><br>صلاحياتك تُدار حسب الدور المحدد لك.</div></div></div>`}
function myProfile(){S.p="profile";document.getElementById("pt").textContent=T.profile[0];document.getElementById("ps").textContent=T.profile[1];render();}
function bindProfile(){let f=document.getElementById("pfself");if(!f)return;let file="";document.getElementById("selfavatar").onchange=e=>readAvatar(e.target.files[0],x=>file=x);f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f),u=S.d.users.find(x=>x.id==S.u.id);u.n=fd.get("n");u.job=fd.get("job");u.phone=fd.get("phone");u.email=fd.get("email");u.emp=fd.get("emp");u.address=fd.get("address");u.notes=fd.get("notes");if(file)u.avatar=file;if(fd.get("p"))u.p=fd.get("p");S.u=u;audit("تعديل الملف الشخصي","Users",u.id);save();render();toast("تم حفظ بياناتك الشخصية")}}
function aiContext(){const assigned=S.d.tasks.filter(t=>t.assignee===S.u.id).slice(-30).map(t=>({title:t.title,status:t.status,due:t.due,priority:t.priority,type:t.type}));const balances=allBalances().filter(x=>x.item&&x.warehouse).map(x=>({item:x.item.name,code:x.item.code,warehouse:x.warehouse.name,balance:x.qty,reorder:x.item.reorder,unit:unit(x.item.unitId)?.name||""}));return {user:{name:S.u.n,role:S.u.r},currency:S.d.settings.currency||"ل.س",inventory:balances.slice(0,300),tasks:act("tasks.manage")?S.d.tasks.slice(-50).map(t=>({title:t.title,status:t.status,due:t.due,priority:t.priority,assignee:S.d.users.find(u=>u.id===t.assignee)?.n||""})):assigned}}function ai(){return `<div class=head><div><h3>✦ مساعد الذكاء الاصطناعي</h3><span class=mut>اسأل عن المخزون، المواد، المستودعات، المهام والتقارير المسموح لك بها</span></div></div><div class=card><div id=aiChat style="min-height:300px;max-height:55vh;overflow:auto;padding:8px"><div class="card" style="background:var(--bg)"><b>مساعد ساحة الدولي</b><p class=mut>مثال: «ما هي المواد التي وصلت تحت حد إعادة الطلب؟» أو «ما هي مهامي المفتوحة؟»</p></div></div><form id=aiForm style="display:flex;gap:8px;margin-top:12px"><input id=aiInput autocomplete=off placeholder="اكتب سؤالك هنا..." style="flex:1"><button class="btn p">إرسال</button></form><div class=mut style="margin-top:8px">المساعد يرى فقط البيانات التي يسمح بها حسابك. لا ترسل كلمات مرور أو مفاتيح سرية.</div></div>`}function aiAsk(){const input=document.getElementById("aiInput"),q=input?.value.trim();if(!q)return;const chat=document.getElementById("aiChat");chat.innerHTML+=`<div style="margin:8px 0;text-align:left"><span class="badge blue">${esc(q)}</span></div>`;input.value="";chat.innerHTML+=`<div id="aiThinking" class="mut">جاري التفكير...</div>`;chat.scrollTop=chat.scrollHeight;const context=aiContext();const url=localStorage.getItem("saha_ai_gateway")||"http://127.0.0.1:8787/ask";fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,context})}).then(r=>r.ok?r.json():r.json().then(x=>Promise.reject(new Error(x.error||"فشل الاتصال")))).then(x=>{document.getElementById("aiThinking")?.remove();chat.innerHTML+=`<div class="card" style="margin:8px 0;background:var(--bg)"><b>مساعد ساحة الدولي</b><div style="white-space:pre-wrap;margin-top:6px">${esc(x.answer||"لم تصل إجابة")}</div></div>`;chat.scrollTop=chat.scrollHeight}).catch(e=>{document.getElementById("aiThinking")?.remove();chat.innerHTML+=`<div class="card" style="margin:8px 0;border-color:#e7aeb2"><b>تعذر الاتصال بالمساعد</b><p class=mut>${esc(e.message)}<br>يمكن ضبط عنوان خدمة الذكاء الاصطناعي من الإعدادات لاحقًا.</p></div>`})} 
function tasks(){let mine=S.d.tasks.filter(t=>t.assignee==S.u.id), rows=(act("tasks.manage")?S.d.tasks:mine);let engineers=S.d.users.filter(u=>u.a&&["مهندس"].includes(u.r));let stat=x=>x==="new"?"جديدة":x==="progress"?"قيد التنفيذ":x==="done"?"مكتملة":"متأخرة";return `<div class=head><div><h3>التعليمات والمهام <span id="taskUnread" class="badge out">${S.d.notifications.filter(n=>n.userId===S.u.id&&!n.read).length} جديدة</span></h3><span class=mut>إرسال مهام وتعليمات لأي مستخدم ومتابعة التنفيذ من داخل التطبيق</span></div>${act("tasks.manage")?`<button class="btn p" onclick="taskForm()">+ إرسال مهمة / تعليمات</button>`:""}</div><div class="grid3"><div class=card><div class=mut>كل المهام</div><b style="font-size:25px">${f(rows.length)}</b></div><div class=card><div class=mut>قيد التنفيذ</div><b style="font-size:25px">${f(rows.filter(t=>t.status==="progress").length)}</b></div><div class=card><div class=mut>مكتملة</div><b style="font-size:25px">${f(rows.filter(t=>t.status==="done").length)}</b></div></div><div class=card style="margin-top:13px"><div class=table><table><tr><th>العنوان</th><th>النوع</th><th>المسند إليه</th><th>الأولوية</th><th>الموعد</th><th>الحالة</th><th>إجراء</th></tr>${rows.slice().reverse().map(t=>{let u=S.d.users.find(x=>x.id==t.assignee),late=t.status!=="done"&&t.due&&t.due<date();let st=late?"late":t.status;return `<tr><td><b>${esc(t.title)}</b><br><small class=mut>${esc(t.description||"")}</small></td><td>${t.type==="instruction"?"تعليمات":"مهمة"}</td><td>${esc(u?.n||"—")}</td><td><span class="badge ${t.priority==="high"?"out":t.priority==="medium"?"low":"blue"}">${t.priority==="high"?"عالية":t.priority==="medium"?"متوسطة":"عادية"}</span></td><td>${esc(t.due||"—")}</td><td><span class="badge ${st==="done"?"ok":st==="progress"?"blue":st==="late"?"out":"low"}">${stat(st)}</span></td><td>${(act("tasks.manage")||t.assignee==S.u.id)?`<button class="btn s" onclick="taskEdit('${t.id}')">تحديث</button>`:"—"}</td></tr>`}).join("")||`<tr><td colspan=7 class=mut>لا توجد مهام حالياً</td></tr>`}</table></div></div>`}
function taskForm(){if(!act("tasks.manage"))return deny();let us=S.d.users.filter(u=>u.a&&u.id!==S.u.id);open("إرسال مهمة / تعليمات",`<form id=tf class=form><label>العنوان<input name=title required placeholder="مثال: فحص مواد المشروع"></label><label>النوع<select name=type><option value=task>مهمة</option><option value=instruction>تعليمات</option></select></label><label>إرسال إلى<select name=assignee required>${us.map(u=>`<option value="${u.id}">${esc(u.n)} — ${esc(u.r)}</option>`).join("")}</select></label><label>الأولوية<select name=priority><option value=normal>عادية</option><option value=medium>متوسطة</option><option value=high>عالية</option></select></label><label>الموعد النهائي<input name=due type=date value="${date()}"></label><label class=full>التفاصيل / التعليمات<textarea name=description required placeholder="اكتب المطلوب بالتفصيل..."></textarea></label><div class=full><button class="btn p">إرسال</button></div></form>`);document.getElementById("tf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:id("task"),title:f.get("title"),type:f.get("type"),assignee:f.get("assignee"),priority:f.get("priority"),due:f.get("due"),description:f.get("description"),status:"new",createdBy:S.u.id,createdAt:new Date().toISOString()};S.d.tasks.push(o);S.d.notifications.push({id:id("nt"),userId:o.assignee,type:"task",title:o.type==="instruction"?"تعليمات جديدة":"مهمة جديدة",message:o.title,taskId:o.id,read:false,createdAt:new Date().toISOString()});audit("إرسال مهمة/تعليمات","Tasks",o.id);save();closeM();render();toast("تم إرسال المهمة/التعليمات للمستخدم داخل التطبيق")}}
function updateNotificationBadge(){let n=S.d.notifications.filter(x=>x.userId===S.u?.id&&!x.read).length,b=document.getElementById("nbadge");if(b){b.textContent=n;b.style.display=n?"inline-block":"none"}}
function showNotifications(){let ns=S.d.notifications.filter(x=>x.userId===S.u.id).slice().reverse();open("الإشعارات",`<div>${ns.map(n=>`<div class="card" style="margin-bottom:8px;border-right:4px solid ${n.read?"#9aa":"#087a4a"}"><b>${esc(n.title)}</b><p>${esc(n.message||"")}</p><small class="mut">${new Date(n.createdAt).toLocaleString("ar-SY")}</small>${n.taskId?`<div style="margin-top:8px"><button class="btn s" onclick="openTaskFromNotification('${n.id}','${n.taskId}')">فتح المهمة</button></div>`:""}</div>`).join("")||`<div class="mut">لا توجد إشعارات</div>`}<div style="margin-top:12px"><button class="btn o" onclick="markNotificationsRead()">تحديد الكل كمقروء</button></div></div>`)}
function markNotificationsRead(){S.d.notifications.forEach(n=>{if(n.userId===S.u.id)n.read=true});save();closeM();updateNotificationBadge();toast("تم تعليم الإشعارات كمقروءة")}
function openTaskFromNotification(nid,tid){let n=S.d.notifications.find(x=>x.id===nid);if(n)n.read=true;save();closeM();S.p="tasks";render();setTimeout(()=>taskEdit(tid),50)}
function taskEdit(tid){let t=S.d.tasks.find(x=>x.id==tid);if(!t)return;let canEdit=act("tasks.manage")||t.assignee==S.u.id;if(!canEdit)return deny();open("تحديث المهمة",`<form id=tf class=form><div class=full><b>${esc(t.title)}</b><p class=mut>${esc(t.description||"")}</p></div><label>الحالة<select name=status><option value=new ${t.status==="new"?"selected":""}>جديدة</option><option value=progress ${t.status==="progress"?"selected":""}>قيد التنفيذ</option><option value=done ${t.status==="done"?"selected":""}>مكتملة</option></select></label><label>الموعد النهائي<input name=due type=date value="${esc(t.due||"")}"></label><label class=full>ملاحظة التنفيذ<textarea name=note>${esc(t.note||"")}</textarea></label><div class=full><button class="btn p">حفظ</button></div></form>`);document.getElementById("tf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);t.status=f.get("status");t.due=f.get("due");t.note=f.get("note");t.updatedBy=S.u.id;t.updatedAt=new Date().toISOString();audit("تحديث حالة مهمة","Tasks",t.id);save();closeM();render();toast("تم تحديث المهمة")}}

function editUser(uid){if(!act("users.manage"))return deny();let u=S.d.users.find(x=>x.id==uid);if(!u)return;open("تعديل بيانات المستخدم",`<form id=uf class=form><div class=full style="display:flex;gap:15px;align-items:center">${avatarHtml(u)}<div><b>${esc(u.u)}</b><div class=mut>يمكن للمدير العام تعديل كامل بيانات المستخدم</div></div></div><label>اسم المستخدم<input name=u value="${esc(u.u)}" readonly></label><label>الاسم الكامل<input name=n value="${esc(u.n||"")}" required></label><label>المسمى الوظيفي<input name=job value="${esc(u.job||"")}"></label><label>رقم الموظف<input name=emp value="${esc(u.emp||"")}"></label><label>رقم الهاتف<input name=phone value="${esc(u.phone||"")}" inputmode=tel></label><label>البريد الإلكتروني<input name=email type=email value="${esc(u.email||"")}"></label><label>العنوان<input name=address value="${esc(u.address||"")}"></label><label>الدور<select name=r>${Object.keys(roles()).map(x=>`<option ${x==u.r?"selected":""}>${esc(x)}</option>`).join("")}</select></label><label>الحالة<select name=a><option value=1 ${u.a?"selected":""}>فعال</option><option value=0 ${!u.a?"selected":""}>معطل</option></select></label><label class=full>ملاحظات<textarea name=notes>${esc(u.notes||"")}</textarea></label><label class=full>الصورة الشخصية<input id=ufavatar class=upload type=file accept="image/*"><small class=mut>الحد الأقصى 700 كيلوبايت.</small></label><label>كلمة المرور الجديدة<input name=p type=password placeholder="اتركها فارغة للإبقاء عليها"></label><div class=full><button class="btn p">حفظ التعديل</button></div></form>`);let photo="";document.getElementById("ufavatar").onchange=e=>readAvatar(e.target.files[0],x=>photo=x);document.getElementById("uf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);u.n=f.get("n");u.job=f.get("job");u.emp=f.get("emp");u.phone=f.get("phone");u.email=f.get("email");u.address=f.get("address");u.notes=f.get("notes");u.r=f.get("r");u.a=f.get("a")=="1";if(photo)u.avatar=photo;if(f.get("p"))u.p=f.get("p");if(S.u.id==u.id)S.u=u;audit("تعديل مستخدم","Users",u.id);save();closeM();render();toast("تم تحديث بيانات المستخدم")}}

function userForm(){if(!act("users.manage"))return deny();open("إضافة مستخدم",`<form id=uf class=form><label>اسم المستخدم<input name=u required></label><label>الاسم الكامل<input name=n required></label><label>المسمى الوظيفي<input name=job></label><label>رقم الموظف<input name=emp></label><label>رقم الهاتف<input name=phone inputmode=tel></label><label>البريد الإلكتروني<input name=email type=email></label><label>العنوان<input name=address></label><label>كلمة المرور<input name=p type=password required></label><label>الدور<select name=r>${Object.keys(roles()).map(x=>`<option>${esc(x)}</option>`).join("")}</select></label><label>الحالة<select name=a><option value=1>فعال</option><option value=0>معطل</option></select></label><label class=full>ملاحظات<textarea name=notes></textarea></label><label class=full>الصورة الشخصية<input id=ufavatar class=upload type=file accept="image/*"><small class=mut>الحد الأقصى 700 كيلوبايت.</small></label><div class=full><button class="btn p">حفظ</button></div></form>`);let photo="";document.getElementById("ufavatar").onchange=e=>readAvatar(e.target.files[0],x=>photo=x);document.getElementById("uf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(S.d.users.some(x=>x.u==f.get("u")))return toast("اسم المستخدم موجود مسبقًا");let o={id:id("u"),u:f.get("u"),n:f.get("n"),p:f.get("p"),r:f.get("r"),a:f.get("a")=="1",job:f.get("job"),emp:f.get("emp"),phone:f.get("phone"),email:f.get("email"),address:f.get("address"),notes:f.get("notes"),avatar:photo};S.d.users.push(o);audit("إضافة مستخدم","Users",o.id);save();closeM();render();toast("تم إنشاء المستخدم")}}

function xesc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}
function excelSheet(name,rows){let keys=rows.length?Object.keys(rows[0]):["لا توجد بيانات"];return `<Worksheet ss:Name="${xesc(name)}"><Table><Row>${keys.map(k=>`<Cell><Data ss:Type="String">${xesc(k)}</Data></Cell>`).join("")}</Row>${rows.map(r=>`<Row>${keys.map(k=>{let v=r[k]??"";let type=typeof v==="number"?"Number":"String";return `<Cell><Data ss:Type="${type}">${xesc(v)}</Data></Cell>`}).join("")}</Row>`).join("")}</Table></Worksheet>`}
function excelXml(sheets){return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center"/></Style></Styles>${sheets.map(x=>excelSheet(x.name,x.rows)).join("")}</Workbook>`}
function exportExcel(){if(!act("reports.export"))return deny();let sheets=[
{name:"المواد",rows:S.d.items.map(i=>({"الكود":i.c,"اسم المادة":i.n,"الباركود":i.bar,"التصنيف":C(i.cat)?.n||"","الوحدة":U(i.unit)?.n||"","الرصيد":total(i.id),"حد إعادة الطلب":i.re,"سعر الشراء":i.buy,"سعر البيع":i.sale,"الحالة":i.active?"فعال":"معطل"}))},

{name:"حركات المخزون",rows:S.d.tx.map(t=>({"التاريخ":t.d,"النوع":t.t,"المادة":I(t.i)?.n||"","المستودع":W(t.w)?.n||"","الكمية":t.q,"المرجع":t.ref,"المستخدم":t.u}))},

{name:"الموردون",rows:S.d.sup.map(x=>({"الكود":x.c,"الاسم":x.n}))},
{name:"المستخدمون",rows:S.d.users.map(u=>({"اسم المستخدم":u.u,"الاسم":u.n,"الهاتف":u.phone||"","البريد":u.email||"","الدور":u.r,"الحالة":u.a?"فعال":"معطل"}))},
{name:"المهام",rows:S.d.tasks.map(t=>({"العنوان":t.title,"المستلم":S.d.users.find(u=>u.id===t.assignee)?.n||"","الأولوية":t.priority||"","الحالة":t.status||"","الموعد":t.due||"","التفاصيل":t.description||""}))}
];download("saha-international-"+date()+".xls",excelXml(sheets),"application/vnd.ms-excel;charset=utf-8");audit("تصدير Excel","Excel","FULL");toast("تم تصدير بيانات Excel")}
function excelTemplate(){if(!act("reports.export"))return deny();let sheets=[{name:"المواد",rows:[{"الكود":"EL-100","اسم المادة":"مثال مادة","الباركود":"628100000100","التصنيف":"كهربائيات","الوحدة":"قطعة","حد إعادة الطلب":10,"سعر الشراء":0,"سعر البيع":0,"الحالة":"فعال"}]},{name:"المستودعات",rows:[{"الكود":"WH-03","المستودع":"مستودع جديد","الموقع":"الموقع","رئيسي":"لا"}]}];download("saha-import-template.xls",excelXml(sheets),"application/vnd.ms-excel;charset=utf-8");toast("تم تنزيل قالب الاستيراد")}
function parseExcelRows(text){let xml=text.trim();if(xml.startsWith("<?xml")||xml.includes("urn:schemas-microsoft-com:office:spreadsheet")){let doc=new DOMParser().parseFromString(xml,"text/xml"),out=[];doc.querySelectorAll("Worksheet").forEach(ws=>{let name=ws.getAttribute("ss:Name")||ws.getAttribute("Name")||"Sheet1",rows=[...ws.querySelectorAll("Table > Row")].map(r=>[...r.children].map(c=>(c.textContent||"").trim()));if(rows.length){let h=rows[0];out.push({name,rows:rows.slice(1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])))});}});return out}let lines=xml.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);let parseLine=l=>{let a=[],cur="",q=false;for(let i=0;i<l.length;i++){let ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){a.push(cur);cur=""}else cur+=ch}a.push(cur);return a};if(!lines.length)return [];let h=parseLine(lines[0]);return [{name:"المواد",rows:lines.slice(1).map(l=>{let a=parseLine(l);return Object.fromEntries(h.map((k,i)=>[k,a[i]??""]))})}]}
function excel(){let canExport=act("reports.export"),canImport=act("data.import");return `<div class="head"><div><h3>استيراد وتصدير Excel</h3><span class="mut">تصدير كامل وقوالب استيراد مع معاينة قبل الحفظ</span></div></div><div class="grid"><div class="card"><h3>تصدير البيانات</h3><p class="mut">ملف Excel واحد يحتوي على عدة أوراق: المواد، المستودعات، الأرصدة، الحركات، العملاء، الموردون، المستخدمون والمهام.</p><button class="btn p" ${canExport?'':'disabled'} onclick="exportExcel()">⬇ تصدير Excel كامل</button></div><div class="card"><h3>قالب الاستيراد</h3><p class="mut">قالب Excel جاهز لإضافة المواد والمستودعات دفعة واحدة.</p><button class="btn s" ${canExport?'':'disabled'} onclick="excelTemplate()">⬇ تنزيل قالب Excel</button></div></div><div class="card" style="margin-top:13px"><h3>استيراد من Excel</h3><p class="mut">يدعم ملف Excel المتوافق مع النظام (.xls) أو CSV. سيتم فحص البيانات وعرض الأخطاء قبل تطبيقها.</p><input id="excelFile" type="file" accept=".xls,.xml,.csv,text/csv,application/vnd.ms-excel" ${canImport?'':'disabled'} onchange="previewExcel(this)"><div id="excelPreview" style="margin-top:12px"></div></div>`}
function previewExcel(inp){let file=inp.files?.[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{let sheets;try{sheets=parseExcelRows(rd.result)}catch(e){return toast("تعذر قراءة ملف Excel")};window._excelPending=sheets;let totalRows=sheets.reduce((n,s)=>n+s.rows.length,0),names=sheets.map(s=>`${s.name} (${s.rows.length})`).join("، ");document.getElementById("excelPreview").innerHTML=`<div class="card"><b>معاينة الاستيراد</b><p class="mut">الأوراق: ${esc(names)} — إجمالي الصفوف: ${totalRows}</p>${sheets.map(s=>`<div class="table" style="margin-top:8px"><table><tr>${Object.keys(s.rows[0]||{}).map(k=>`<th>${esc(k)}</th>`).join("")}</tr>${s.rows.slice(0,5).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>`).join("")}<div style="margin-top:12px"><button class="btn p" onclick="applyExcelImport()">✓ فحص وتطبيق البيانات</button></div></div>`};rd.readAsText(file,"UTF-8")}
function applyExcelImport(){if(!act("data.import"))return deny();let sheets=window._excelPending||[],errors=[],added={items:0,wh:0};let catsByName=Object.fromEntries(S.d.cat.map(x=>[x.n,x.id])),unitsByName=Object.fromEntries(S.d.unit.map(x=>[x.n,x.id]));for(let sh of sheets){if(sh.name==="المواد"){for(let [idx,r] of sh.rows.entries()){let code=(r["الكود"]||r.code||"").trim(),name=(r["اسم المادة"]||r["الاسم"]||"").trim();if(!code||!name){errors.push(`المواد — صف ${idx+2}: الكود والاسم مطلوبان`);continue}if(S.d.items.some(x=>x.c===code)){errors.push(`المواد — صف ${idx+2}: الكود ${code} موجود مسبقًا`);continue}let catName=(r["التصنيف"]||"").trim(),unitName=(r["الوحدة"]||"").trim();if(catName&&!catsByName[catName]){let c={id:id("c"),n:catName};S.d.cat.push(c);catsByName[catName]=c.id}if(unitName&&!unitsByName[unitName]){let u={id:id("u"),n:unitName};S.d.unit.push(u);unitsByName[unitName]=u.id}S.d.items.push({id:id("i"),c:code,n:name,bar:(r["الباركود"]||"").trim(),cat:catsByName[catName]||S.d.cat[0]?.id,unit:unitsByName[unitName]||S.d.unit[0]?.id,re:+(r["حد إعادة الطلب"]||0),buy:+(r["سعر الشراء"]||0),sale:+(r["سعر البيع"]||0),active:(r["الحالة"]||"فعال")!=="معطل"});added.items++}}else if(sh.name==="المستودعات"){for(let [idx,r] of sh.rows.entries()){let code=(r["الكود"]||"").trim(),name=(r["المستودع"]||"").trim();if(!code||!name){errors.push(`المستودعات — صف ${idx+2}: الكود والاسم مطلوبان`);continue}if(S.d.wh.some(x=>x.c===code)){errors.push(`المستودعات — صف ${idx+2}: الكود ${code} موجود مسبقًا`);continue}S.d.wh.push({id:id("w"),c:code,n:name,l:(r["الموقع"]||"").trim(),main:(r["رئيسي"]||"")==="نعم"?1:0});added.wh++}}}if(errors.length){document.getElementById("excelPreview").insertAdjacentHTML("beforeend",`<div class="danger-box" style="margin-top:12px"><b>لم يتم تطبيق أي صف بسبب وجود أخطاء.</b><br>${errors.slice(0,20).map(esc).join("<br>")}</div>`);return}audit("استيراد Excel","Excel",`مواد:${added.items} مستودعات:${added.wh}`);save();render();toast(`تم استيراد ${added.items} مادة و${added.wh} مستودع`) }
function settings(){let s=S.d.set;return `<div class=card><h3>الإعدادات</h3><form id=sf class=form><label>اسم الشركة<input name=c value="${esc(s.company)}"></label><label>العملة<select name=cur><option value="ل.س" ${s.currency==="ل.س"?"selected":""}>الليرة السورية (ل.س)</option><option value="USD" ${s.currency==="USD"?"selected":""}>الدولار الأمريكي (USD)</option><option value="EUR" ${s.currency==="EUR"?"selected":""}>اليورو (EUR)</option></select></label><label>الرصيد السالب<select name=neg><option value=0 ${!s.negative?"selected":""}>ممنوع</option><option value=1 ${s.negative?"selected":""}>مسموح</option></select></label><div class=full><button class="btn p">حفظ</button></div></form></div><div class=card style="margin-top:13px"><h3>Audit Log</h3><div class=table><table><tr><th>التاريخ</th><th>المستخدم</th><th>العملية</th><th>الكيان</th><th>المرجع</th></tr>${S.d.audit.slice(0,60).map(a=>`<tr><td>${a.d}</td><td>${a.u}</td><td>${a.a}</td><td>${a.e}</td><td>${a.r}</td></tr>`).join("")}</table></div></div>`}
function backup(){return `<div class=grid><div class=card><h3>إنشاء نسخة احتياطية</h3><p class=mut>JSON كامل لبيانات النسخة التجريبية.</p><button class="btn p" onclick="bak()">تنزيل Backup</button></div><div class=card><h3>استعادة</h3><input type=file accept=.json onchange="restore(this)"><div class=badge out style="margin-top:12px">الاستعادة تستبدل البيانات الحالية.</div></div></div>`}
function bak(){if(!act("backup.create"))return deny();let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S.d,null,2)],{type:"application/json"}));a.download="saha-backup-"+date()+".json";a.click();audit("Backup","System","-");toast("تم تنزيل النسخة")}
function restore(x){let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.users||!d.items||!d.tx)throw 0;if(!confirm("استبدال البيانات الحالية؟"))return;S.d=d;save();render();toast("تمت الاستعادة")}catch(e){toast("الملف غير صالح")}};r.readAsText(x.files[0])}

Object.assign(window,{nav,ai,aiAsk,tasks,taskForm,taskEdit,itemForm,whForm,whDetails,receipt,line,transfer,trline,countForm,countLines,partner,report,gsearch,scan,userForm,bak,restore,closeM});
